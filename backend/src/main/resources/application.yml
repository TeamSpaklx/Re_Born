spring:
  application:
    name: reborn-backend
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SUPABASE_DB_USERNAME:postgres}
    password: ${SUPABASE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger

supabase:
  jwks-url: ${SUPABASE_JWKS_URL:https://cblolxoebahefwbyhoqe.supabase.co/auth/v1/.well-known/jwks.json}

reborn:
  ai:
    enabled: ${AI_ANALYSIS_ENABLED:false}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-6-luna}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
